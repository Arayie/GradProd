version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # GROWWW INVESTOR DISCOVERY ENGINE (PRIMARY WEB SERVICE)
  # ----------------------------------------------------------------------------
  growww-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: growww-discovery-engine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8501}:8501"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_PORT=8501
      - APP_HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/growww_discovery.db}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-true}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - RESEARCHER_PASSWORD_HASH=${RESEARCHER_PASSWORD_HASH:-}
      - VIEWER_PASSWORD_HASH=${VIEWER_PASSWORD_HASH:-}
      - AUDITOR_PASSWORD_HASH=${AUDITOR_PASSWORD_HASH:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/growww_production.log
      - SCHEDULED_REFRESH_ENABLED=${SCHEDULED_REFRESH_ENABLED:-false}
    volumes:
      # Persistent storage mounts for database, logs, and generated outputs
      - growww_db_data:/app/data
      - growww_logs:/app/logs
      - growww_outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - growww-net

  # ----------------------------------------------------------------------------
  # OPTIONAL: MANAGED POSTGRESQL SERVICE (PROFILE: postgres)
  # Run with: docker-compose --profile postgres up -d
  # ----------------------------------------------------------------------------
  growww-postgres:
    image: postgres:15-alpine
    container_name: growww-postgres-db
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-growww_discovery}
      POSTGRES_USER: ${POSTGRES_USER:-growww_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-growww_secure_pass_2026}
    volumes:
      - growww_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-growww_user} -d ${POSTGRES_DB:-growww_discovery}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - growww-net

volumes:
  growww_db_data:
    driver: local
  growww_logs:
    driver: local
  growww_outputs:
    driver: local
  growww_pg_data:
    driver: local

networks:
  growww-net:
    driver: bridge
