  # =========================================================================
  # DIMENSION I: EXPLICITLY DISCLOSED SEGMENT INFORMATION
  # =========================================================================
  disclosed_segments:
    name: "Explicitly Disclosed Segment Information"
    description: "Demographic and contextual disclosures provided voluntarily and explicitly by the reviewer in the text."
    strict_governance_rule: >
      All segment attributes MUST default to UNKNOWN.
      NEVER infer demographics, income level, location, or age from usernames, grammar, regional slang, or sentiment.
      Only populate if reviewer explicitly states the attribute (e.g., 'I am a 21-year-old college student').
    allowed_attributes:
      age_band:
        description: "Explicitly stated age or age group."
        default: "UNKNOWN"
        allowed_values:
          - "STUDENT_COLLEGE"        # e.g., 'College student', '20 years old'
          - "YOUNG_PROFESSIONAL"     # e.g., 'First job', '25 years old'
          - "MID_CAREER"             # e.g., '35-45 years old', 'family with 2 kids'
          - "RETIREE_SENIOR"         # e.g., 'Senior citizen', 'Retired person', '65 years old'
          - "UNKNOWN"

      income_stability:
        description: "Explicitly disclosed nature of earnings."
        default: "UNKNOWN"
        allowed_values:
          - "SALARIED_FIXED"         # e.g., 'Monthly salaried employee'
          - "VARIABLE_GIG_BUSINESS"  # e.g., 'Freelancer', 'Small shop owner', 'Irregular income'
          - "NON_EARNING_ALLOWANCE"  # e.g., 'Pocket money', 'Homemaker'
          - "UNKNOWN"

      money_source:
        description: "Explicit origin of the money being invested."
        default: "UNKNOWN"
        allowed_values:
          - "MONTHLY_SALARY"
          - "POCKET_MONEY_SAVINGS"
          - "GIFT_INHERITANCE"
          - "BUSINESS_PROFIT"
          - "UNKNOWN"

      influence:
        description: "Explicit external trigger that led to app install."
        default: "UNKNOWN"
        allowed_values:
          - "SELF_DISCOVERED"
          - "FRIEND_FAMILY"
          - "FINFLUENCER_SOCIAL_MEDIA"
          - "COLLEGE_OFFICE_PEER"
          - "UNKNOWN"
